<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Travelade Limited</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/favicon.png?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 50px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .icon { width: 80px; height: 80px; background: #e8f4fc; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; color: #1E5FA8; }
        h1 { color: #1E5FA8; font-size: 28px; margin-bottom: 12px; }
        p { color: #666; line-height: 1.6; margin-bottom: 25px; font-size: 15px; }
        .btn { display: inline-block; background: #1E5FA8; color: white; padding: 14px 40px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; }
        .btn:hover { background: #164a84; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#10003;</div>
        <h1>Thank You!</h1>
        <p>Your submission has been received successfully. We'll review your details and get back to you within 24 hours.</p>
        <a href="https://travelade.co.uk" class="btn">Back to Home</a>
    </div>

</html>
